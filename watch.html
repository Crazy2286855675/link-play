<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>播放 · Link Play</title>
  <meta name="description" content="用 WebTorrent 在浏览器里播放磁力链接，不从本站输出视频字节。">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="watch-page">
  <div class="wrap">
    <header class="watch-header">
      <div class="brand">
        <strong>Link Play</strong>
        <span>深色播放页 · 边下边播</span>
      </div>
      <div class="watch-actions">
        <a class="btn ghost" href="index.html">返回片单</a>
        <button class="btn" id="copy-link" type="button">复制链接</button>
      </div>
    </header>

    <p id="status" class="status">准备播放…</p>

    <div class="player-stage">
      <video id="player" controls playsinline></video>
    </div>

    <div class="stats" aria-live="polite">
      <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
      <span id="percent">0%</span>
      <span id="peers">0 节点</span>
      <span id="speed">0 B/s</span>
    </div>
    <p class="muted" id="downloaded">0 B / 0 B</p>

    <section class="watch-meta">
      <h1 id="title">加载中</h1>
      <p id="description" class="muted"></p>
      <p class="legal">视频来自 BitTorrent 节点和 web seed，不是本站服务器推流。请确认你有权获取并观看该磁力内容。</p>
    </section>
  </div>
  <script type="module" src="assets/watch.js"></script>
</body>
</html>
