<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="theater">
  <header class="bar theater-bar">
    <a class="logo" href="index.html">Link<span>Play</span></a>
    <div class="watch-actions">
      <a class="ghost" href="index.html">返回</a>
      <button class="ghost solid" id="copy-link" type="button">复制</button>
    </div>
  </header>
  <main class="screen">
    <div class="player-stage">
      <video id="player" controls playsinline></video>
    </div>
    <div class="ticker" aria-live="polite">
      <div class="progress"><span id="progress-bar"></span></div>
      <span id="percent">0%</span>
      <span id="peers">0</span>
      <span id="speed">0</span>
    </div>
    <p id="status" class="status"></p>
    <h1 id="title"></h1>
    <p id="description" hidden></p>
    <span id="downloaded" hidden></span>
  </main>
  <script type="module" src="assets/watch.js"></script>
</body>
</html>
